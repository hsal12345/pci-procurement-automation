apiVersion: v1
kind: ConfigMap
metadata:
  name: pci-docker-app-config
  namespace: pci-procurement
  labels:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pci-procurement
data:
  APP_NAME: "PCI Procurement & SPJ System"
  APP_ENV: "production"
  DEBUG: "false"
  DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword2026!@pci-postgres-service:5432/pci_spjed"
  ASYNC_DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword2026!@pci-postgres-service:5432/pci_spjed"
  USE_SQLITE_FALLBACK: "false"
  LIBREOFFICE_PATH: "/usr/bin/soffice"
  AI_ENABLED: "true"
  AI_PROVIDER: "mock"
  AI_MODEL: "google/gemini-2.0-flash-exp:free"
  AI_MONTHLY_BUDGET_USD: "10.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: pci-docker-app-secret
  namespace: pci-procurement
  labels:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pci-procurement
type: Opaque
stringData:
  SECRET_KEY: "pci-procurement-k8s-production-secret-key-2026"
  AI_API_KEY: ""
  AI_BASE_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pci-docker-app-storage-pvc
  namespace: pci-procurement
  labels:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pci-procurement
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pci-docker-app
  namespace: pci-procurement
  labels:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pci-procurement
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-app
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-app
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend-api
          image: pci-procurement-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pci-docker-app-config
            - secretRef:
                name: pci-docker-app-secret
          volumeMounts:
            - name: backend-storage
              mountPath: /app/storage
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: pci-docker-app-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pci-docker-app-service
  namespace: pci-procurement
  labels:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pci-procurement
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http-api
      protocol: TCP
  selector:
    app.kubernetes.io/name: docker-app
    app.kubernetes.io/component: backend

