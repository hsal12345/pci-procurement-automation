services:
  db:
    image: postgres:16-alpine
    container_name: pci-procurement-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pci_spjed}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pci_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pci_spjed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pci-procurement-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "PCI Procurement & SPJ System"
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pci_spjed}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pci_spjed}
      USE_SQLITE_FALLBACK: "false"
      LIBREOFFICE_PATH: /usr/bin/soffice
      SECRET_KEY: ${SECRET_KEY:-pci-procurement-docker-secret-key-2026}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.0-flash-exp:free}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10.0}
      DRIVE_SYNC_ENABLED: ${DRIVE_SYNC_ENABLED:-true}
      DRIVE_SYNC_MODE: ${DRIVE_SYNC_MODE:-auto}
      GOOGLE_DRIVE_CREDENTIALS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_PATH:-credentials/gdrive-service-account.json}
      GOOGLE_DRIVE_FOLDER_ID_PATH: ${GOOGLE_DRIVE_FOLDER_ID_PATH:-credentials/gdrive-folder-id.txt}
      GOOGLE_DRIVE_OAUTH_CLIENT_PATH: ${GOOGLE_DRIVE_OAUTH_CLIENT_PATH:-credentials/gdrive-oauth-client.json}
      GOOGLE_DRIVE_OAUTH_TOKEN_PATH: ${GOOGLE_DRIVE_OAUTH_TOKEN_PATH:-credentials/gdrive-oauth-token.json}
      GOOGLE_DRIVE_OAUTH_REDIRECT_URI: ${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/archive/oauth/callback}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pci_backend_storage:/app/storage
      - ./backend/credentials:/app/credentials
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: pci-procurement-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: pci-procurement-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/pci-ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: pci-procurement-dbeaver
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - pci_cloudbeaver_data:/opt/cloudbeaver/workspace
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pci_postgres_data:
  pci_backend_storage:
  pci_cloudbeaver_data:

